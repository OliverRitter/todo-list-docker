name: spatial-todo-dev

services:
  database_postgres:
    image: postgis/postgis:16-3.4-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - g2_db_store:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 4s
      timeout: 4s
      retries: 5
    restart: unless-stopped

  backend_node:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx tsx src/db/bootstrap.ts && npx tsx --watch src/index.ts"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database_postgres:5432/${POSTGRES_DB}
      FRONTEND_ORIGIN: http://localhost:8080
    depends_on:
      database_postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend_next:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    volumes:
      - ./frontend-next:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npx next dev -p 3000 -H 0.0.0.0"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database_postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_URL: http://localhost:8080
      FRONTEND_ORIGIN: http://localhost:8080
    depends_on:
      - backend_node
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    environment:
      BACKEND_UPSTREAM: backend_node:4000
      FRONTEND_UPSTREAM: frontend_next:3000
      NGINX_ENVSUBST_FILTER: ^(BACKEND_UPSTREAM|FRONTEND_UPSTREAM)$
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend_node
      - frontend_next
    restart: unless-stopped

  pgadmin_gui:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-local-dev-only-change-me}
    ports:
      - "5050:80"

volumes:
  g2_db_store:
    external: true
    name: todo-list-docker-2_g2_db_store