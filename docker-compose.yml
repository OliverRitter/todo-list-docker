services:
  database_postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: g2-storage-postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - g2_db_store:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 4s
      timeout: 4s
      retries: 5

  backend_node:
    image: node:22-alpine
    container_name: g2-runtime-node
    working_dir: /app
    volumes:
      - ./backend:/app
      # Mask node_modules to avoid host vs container file lock conflict loops
      - /app/node_modules
    command: sh -c "npm install && npx tsx --watch src/index.ts"
    env_file:
      - .env
    environment:
      # Internal Docker network endpoint resolving the DB directly via container alias
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database_postgres:5432/${POSTGRES_DB}
    ports:
      - "4000:4000"
    depends_on:
      database_postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend_next:
    image: node:22-alpine
    container_name: g2-runtime-next
    working_dir: /app
    volumes:
      - ./frontend-next:/app
      # Mask local build outputs and modules so host machine doesn't lock container files
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npx next dev -p 3000 -H 0.0.0.0"
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend_node
    restart: unless-stopped
  pgadmin_gui:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_database_gui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "oliver@myhome.com" # 🎯 Your login email for the browser dashboard
      PGADMIN_DEFAULT_PASSWORD: "g2-secure-dashboard-admin-2026" # 🎯 Your login password for the browser dashboard
    ports:
      - "5050:80" # 🎯 Maps pgAdmin to port 5050 on your laptop

volumes:
  g2_db_store:
